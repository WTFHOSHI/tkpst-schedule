name: Tkpst
options:
  bundleIdPrefix: ru.yami
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  TkpstCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Tkpst:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: TkpstCore
      - target: TkpstWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.yami.tkpst
        PRODUCT_NAME: Tkpst
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Manual
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ТКПСТ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSLocationWhenInUseUsageDescription: Чтобы определить домашний адрес и найти ближайшие остановки.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ru.yami.tkpst.sync]
        ITSAppUsesNonExemptEncryption: false

  # Виджет «Текущая и следующая пара». Расписание скачивает сам: общая с приложением
  # память (App Group) недоступна при установке через AltStore с бесплатным Apple ID.
  TkpstWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: App/Sources/ScheduleRepository.swift
      - path: App/Sources/OverridesStore.swift
      - path: App/Sources/Http.swift
    dependencies:
      - package: TkpstCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.yami.tkpst.widget
        PRODUCT_NAME: TkpstWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ТКПСТ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
