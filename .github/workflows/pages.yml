name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Tests (расписание, ЛК и Postgres)
        run: npm test
      - name: Check overrides.json
        run: node -e "JSON.parse(require('fs').readFileSync('web/overrides.json','utf8'))"
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r web/index.html web/style.css web/sw.js web/manifest.webmanifest web/overrides.json web/js web/icons _site/
          # Pages cannot serve the account API. Open the full application on Vercel.
          # Keep overrides.json here for the admin panel and native applications.
          cp pages/index.html _site/index.html
          # новая версия кэша офлайн-оболочки на каждую сборку
          sed -i "s/tkpst-shell-v[0-9]*/tkpst-shell-${{ github.run_number }}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
