name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Tests + build
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tkpst-schedule-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tkpst-schedule-apk
          path: tkpst-schedule-${{ github.run_number }}.apk

      - name: Publish release (APK for phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: Автоматическая сборка из ${{ github.sha }}
          files: tkpst-schedule-${{ github.run_number }}.apk
