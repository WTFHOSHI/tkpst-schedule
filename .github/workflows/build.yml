name: Release apps and services

on:
  push:
    branches: [main]
    # правки из админ-панели меняют только данные — APK/IPA пересобирать не нужно
    paths-ignore: ['web/overrides.json']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test && npm run build && npm run test:visual && node scripts/recovery-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-visual-check
          path: captures/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Tests + build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Report errors
        if: failure()
        run: |
          {
            grep -E "^e: |What went wrong|FAILED|Caused by|Exception" -A3 gradle.log | head -60
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              grep -A6 "<failure" "$f" | head -20
            done
          } > err.txt || true
          msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle::$msg"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tkpst-schedule-${{ github.run_number }}.apk
          mkdir -p shots && find . -path '*/build/screenshots/*.png' -exec cp {} shots/ \;
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            tkpst-schedule-${{ github.run_number }}.apk
            shots/*.png

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          which xcbeautify || brew install xcbeautify
          which xcodegen || brew install xcodegen
          xcodebuild -version

      - name: Core tests (логика расписания и маршрутов)
        working-directory: ios/Core
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log | xcbeautify --renderer github-actions
          summary=$(grep -E "Executed [0-9]+ tests?" test.log | tail -1)
          echo "::notice title=XCTest::$summary"
          echo "$summary" | grep -q "with 0 failures"

      - name: Generate Xcode project
        if: hashFiles('ios/project.yml') != ''
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, для AltStore)
        if: hashFiles('ios/project.yml') != ''
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tkpst.xcodeproj -scheme Tkpst -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | xcbeautify --renderer github-actions

      - name: Package IPA
        if: hashFiles('ios/project.yml') != ''
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Tkpst.app Payload/
          zip -qry ../tkpst-schedule-${{ github.run_number }}.ipa Payload

      - uses: actions/upload-artifact@v4
        if: hashFiles('ios/project.yml') != ''
        with:
          name: ios
          path: tkpst-schedule-${{ github.run_number }}.ipa

  # APK/IPA are published only after the matching services and Pages are verified.
  deploy:
    needs: [web-visual, android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_wX4hcty9r4COOm7Swu4ZJmtu
      VERCEL_PROJECT_ID: prj_l65yfJSTXnsq28UOd72JhBkcEyrx
      CLOUDFLARE_ACCOUNT_ID: 96e67c17fe64e93d934322bc6cbdbe71
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::Add VERCEL_TOKEN to repository Actions secrets"; exit 1; }
      - run: npm ci
      - name: Install pinned deployment tools
        run: npm install --no-save --package-lock=false wrangler@4.156.0 vercel@65.9.0
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: Deploy API from the tested commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --scope miryzzzs-projects --build-env GITHUB_SHA="$GITHUB_SHA" "$GITHUB_RUN_NUMBER" --build-env RELEASE_BUILD="$GITHUB_RUN_NUMBER"
      - name: Verify API release
        run: node scripts/verify-release.mjs https://tkpst-schedule.vercel.app "$GITHUB_SHA" "$GITHUB_RUN_NUMBER"
      - name: Deploy the tested Worker and interface
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify account release
        run: node scripts/verify-release.mjs https://tkpst-account.telling-math.workers.dev "$GITHUB_SHA" "$GITHUB_RUN_NUMBER"

  pages:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [android, ios, web-visual, deploy, pages]
    permissions:
      contents: write
    if: always() && github.ref == 'refs/heads/main' && needs.android.result == 'success' && needs.ios.result == 'success' && needs.web-visual.result == 'success' && needs.deploy.result == 'success' && needs.pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release (APK + IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            Автоматическая сборка из ${{ github.sha }}
            - `.apk` — Android
            - `.ipa` — iPhone (ставится через AltStore / SideStore)
          files: |
            out/*.apk
            out/*.ipa
